name: Trigger Render Scraper

on:
  schedule:
    # Runs at 00:30 UTC every day (6:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  trigger-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper API on Render
        run: |
          # Sends a POST request to wake up Render and trigger the scraping in the background.
          # Ensure RENDER_DEPLOY_URL and SCRAPER_API_KEY are configured in GitHub Secrets.
          curl -X POST "${{ secrets.RENDER_DEPLOY_URL }}/api/run-scraper" \
               -H "Authorization: Bearer ${{ secrets.SCRAPER_API_KEY }}" \
               -H "Content-Type: application/json"
